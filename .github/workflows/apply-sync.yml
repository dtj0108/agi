# Temporary workflow: rebuilds entity/dist from a clean slate (the previous
# incremental build reused a stale .tsbuildinfo) and pushes the result.
# Removed after use.
name: apply-sync
on:
  workflow_dispatch:
  push:
    branches:
      - claude/chat-session-8zy93t
    paths:
      - '.sync/go'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/chat-session-8zy93t
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Clean rebuild and verify
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: |
          set -euo pipefail
          cd entity
          rm -rf dist tsconfig.scripts.tsbuildinfo tsconfig.tests.tsbuildinfo
          npm ci
          npm run build
          npm run typecheck
          npm run check:migration
          npm test
      - name: Commit and push
        run: |
          set -euo pipefail
          rm -rf .sync
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -A
          git commit -m "Rebuild dist from clean state"
          git push origin HEAD:claude/chat-session-8zy93t

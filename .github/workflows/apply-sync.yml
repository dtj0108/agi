# Temporary workflow: applies a base64-encoded tarball of source files pushed
# under .sync/ to this branch (sha256-gated), rebuilds dist, and pushes the
# result. Removed after use.
name: apply-sync
on:
  workflow_dispatch:
  push:
    branches:
      - claude/chat-session-8zy93t
    paths:
      - '.sync/go'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/chat-session-8zy93t
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply source payload
        run: |
          set -euo pipefail
          cat .sync/payload.part-* > /tmp/payload.b64
          python3 -c "$(printf 'data = list(open(\"/tmp/payload.b64\").read())\nfor pos, ch in [(8225, \"l\"), (12898, \"2\"), (117472, \"9\")]:\n    data[pos] = ch\nopen(\"/tmp/payload.b64\", \"w\").write(\"\".join(data))\n')"
          base64 -d /tmp/payload.b64 > /tmp/payload.tar.gz
          echo "1bc214df1a5135d7c8e8e6a28ecfd195e58fd5573d08eb06e95ee53f021d6f98  /tmp/payload.tar.gz" | sha256sum -c
          tar xzf /tmp/payload.tar.gz -C .
          rm -f entity/src/index.js entity/src/cli/index.js
          rm -rf .sync
      - name: Rebuild dist and typecheck
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: |
          set -euo pipefail
          cd entity
          npm ci
          npm run build
          npm run typecheck
          npm run check:migration
          npm test
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -A
          git commit -m "Apply TS migration cleanup: strict tsconfigs, resolved ts-migration markers, dist rebuild"
          git push origin HEAD:claude/chat-session-8zy93t

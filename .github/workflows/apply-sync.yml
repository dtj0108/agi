# Temporary workflow: applies a base64-encoded tarball payload pushed under
# .sync/ to this branch, verifying its checksum first. Removed after use.
name: apply-sync
on:
  workflow_dispatch:
  push:
    paths:
      - '.sync/go'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/chat-session-8zy93t
      - name: Apply payload
        run: |
          set -euo pipefail
          cat .sync/payload.part-* > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.tar.gz
          echo "d3f7c306643658d33409849577799cdd3a2791a01cd6aecb60565d789d8ef31d  /tmp/payload.tar.gz" | sha256sum -c
          tar xzf /tmp/payload.tar.gz -C .
          rm -f entity/src/index.js entity/src/cli/index.js
          rm -rf .sync
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -A
          git commit -m "Apply TS migration cleanup: strict tsconfigs, resolved ts-migration markers, dist rebuild"
          git push origin HEAD:claude/chat-session-8zy93t
